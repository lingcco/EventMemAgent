name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight validation dependency
        run: python -m pip install PyYAML hydra-core==1.3.2 setuptools wheel
      - name: Validate editable packaging without ML downloads
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Compile project Python sources
        run: |
          python -m compileall -q eventmemagent verl/tools verl/utils/reward_score/video_agent.py scripts
      - name: Validate shell entry points
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Validate repository release hygiene
        run: python scripts/utils/validate_setup.py --mode repo
      - name: Test paper settings and benchmark scoring
        run: python -m unittest discover -s tests -v
      - name: Compose the actual training configuration without GPUs
        run: bash scripts/train/train.sh --dry-run
      - name: Check whitespace errors
        run: git diff --check HEAD
